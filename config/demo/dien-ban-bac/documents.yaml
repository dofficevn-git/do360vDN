# Lời dẫn (Văn phòng biên tập). Không nêu số ngoài bộ số của kỳ — hậu kiểm sẽ chặn.
narratives:
  "2026-6M":
    chi_dao.loi_dan: >
      Trong 6 tháng đầu năm 2026, UBND phường tập trung chỉ đạo thực hiện các nhiệm vụ trọng tâm theo Nghị quyết của Đảng uỷ,
      HĐND phường và chỉ đạo của UBND thành phố; duy trì nền nếp giao ban tuần, kiểm tra tiến độ từng lĩnh vực; kịp thời ban hành
      văn bản chỉ đạo về ngân sách, đầu tư công, trật tự đô thị và an sinh xã hội.
    kinh_te.loi_dan: >
      Kinh tế trên địa bàn trong 6 tháng đầu năm 2026 tiếp tục ổn định; thu, chi ngân sách bám sát dự toán được giao; các công trình,
      dự án được đôn đốc bảo đảm tiến độ giải ngân; công tác quản lý trật tự xây dựng, vệ sinh môi trường được tăng cường.
    vhxh.loi_dan: >
      Các chính sách an sinh xã hội được thực hiện đầy đủ, kịp thời; công tác y tế dự phòng, tiêm chủng mở rộng và chăm sóc sức khoẻ
      ban đầu được duy trì; phong trào văn hoá, thể thao cơ sở có bước phát triển.
    noi_chinh.loi_dan: >
      Công tác tư pháp, hộ tịch, tiếp công dân, cải cách hành chính và bảo đảm an ninh trật tự được triển khai đồng bộ; Bộ phận Một cửa
      duy trì giải quyết hồ sơ đúng hạn; tình hình an ninh chính trị, trật tự an toàn xã hội cơ bản ổn định.
    nhiem_vu.ky_toi: >
      Tập trung hoàn thành các chỉ tiêu kinh tế - xã hội 6 tháng cuối năm; đẩy nhanh giải ngân vốn đầu tư công; giải quyết dứt điểm
      đơn thư tồn đọng; chuẩn bị tốt công tác tuyển quân và các nhiệm vụ quốc phòng, an ninh cuối năm.
  "2026-9M":
    # Lỗi thật số 3: Văn phòng dán lại lời kỳ 6 tháng còn nguyên "6 tháng đầu năm" → gate nhóm Nhất quán kỳ cảnh báo tại đoạn
    kinh_te.loi_dan_wrong: >
      Kinh tế trên địa bàn trong 6 tháng đầu năm 2026 tiếp tục ổn định; thu, chi ngân sách bám sát dự toán được giao; các công trình,
      dự án được đôn đốc bảo đảm tiến độ giải ngân.
    chi_dao.loi_dan: >
      Trong 9 tháng đầu năm 2026, UBND phường tập trung chỉ đạo thực hiện các nhiệm vụ trọng tâm theo kế hoạch năm và chỉ đạo của
      UBND thành phố; duy trì nền nếp giao ban, kiểm tra, đôn đốc tiến độ từng lĩnh vực; chỉ đạo chốt số liệu phục vụ báo cáo theo
      Công văn 2044/UBND-VP.
    kinh_te.loi_dan: >
      Kinh tế trên địa bàn trong 9 tháng đầu năm 2026 tiếp tục ổn định; thu ngân sách đạt tiến độ khá so với dự toán, chi ngân sách
      bảo đảm đúng chế độ; các công trình, dự án được đôn đốc giải ngân theo Công văn 2210/UBND-KT của UBND thành phố.
    vhxh.loi_dan: >
      Các chính sách an sinh xã hội được chi trả đầy đủ, kịp thời; công tác y tế dự phòng, tiêm chủng mở rộng đợt 2 theo Kế hoạch
      197/KH-UBND được triển khai đúng tiến độ; đã ban hành Kế hoạch 253/KH-UBND về phòng, chống dịch bệnh mùa mưa bão.
    noi_chinh.loi_dan: >
      Công tác tư pháp, hộ tịch, tiếp công dân, cải cách hành chính và bảo đảm an ninh trật tự được triển khai đồng bộ; Bộ phận Một cửa
      giữ tỷ lệ hồ sơ giải quyết đúng hạn cao; an ninh trật tự dịp Quốc khánh được bảo đảm theo Công văn 5021/CATP-PV01.
    nhiem_vu.ky_toi: >
      Tập trung hoàn thành các chỉ tiêu chưa đạt kế hoạch năm, nhất là giải ngân vốn đầu tư công và giảm nghèo; giải quyết dứt điểm
      đơn thư đang xử lý trước giữa tháng sau; rà soát hộ nghèo, hộ cận nghèo cuối năm; chuẩn bị quyết toán ngân sách và các nhiệm vụ
      quốc phòng, an ninh cuối năm.
